<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hazte un canutillo</title><style>
*{box-sizing:border-box}body{margin:0;background:#130b29;color:#fff;font:16px system-ui,Arial}header{display:flex;gap:15px;align-items:center;padding:12px 20px;background:#21103b}header img{width:62px;height:62px;object-fit:contain;border-radius:50%}h1{margin:0;color:#ffd769;font-size:clamp(23px,5vw,40px)}main{max-width:1080px;margin:auto;padding:16px}.stage{background:linear-gradient(#170c2970,#170c29aa),url('escenario.png') center/cover;min-height:185px;border-radius:18px;display:grid;place-items:center;text-align:center;font-size:clamp(24px,4vw,44px);font-weight:900;text-shadow:0 3px 8px #000}.panel{background:#291c43;border:1px solid #695386;border-radius:18px;padding:20px;margin:15px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answer{padding:16px;background:#3b2a5c;border-radius:14px;border:1px solid #755c98}.answer.correct{background:#146c4c}.answer.out{opacity:.35}.answer input{width:100%;font-size:20px;margin-top:12px;background:#190e31;color:white;border:1px solid #ad91d4;border-radius:9px;padding:12px}button{background:#ffd56e;color:#26133c;font-size:16px;font-weight:800;border:0;border-radius:12px;padding:13px 17px;margin:5px;cursor:pointer}button:disabled{opacity:.35;cursor:default}.secondary{background:#765ba5;color:white}input[type=text]{font-size:18px;padding:14px;border-radius:10px;background:#140a2a;border:1px solid #9e85c2;color:white;width:min(100%,350px)}.pill{display:inline-block;border-radius:50px;background:#5c447e;padding:8px 12px;margin:4px}.gold{font-size:30px;color:#ffd56e;font-weight:900}.timer{font-size:42px;color:#ffd56e;font-weight:900}.error{background:#b8395c;padding:12px;border-radius:10px}.rules{line-height:1.65}.small{opacity:.75;font-size:14px}#qr{display:block;background:white;border-radius:12px;padding:10px;width:220px;height:220px;margin:15px auto}a{color:#ffd56e}#qr img{width:200px;height:200px}@media(max-width:620px){.answers{grid-template-columns:1fr}.panel{padding:15px}.stage{min-height:115px}}

/* Alertas en pantalla completa para antitrampas y comodines (solo TV) */
.power-overlay .cheat-card{background:linear-gradient(140deg,#243b69,#2b164a);border-color:#76dbff;box-shadow:0 0 90px #48baff66}
.power-overlay .cheat-title{color:#92e7ff}
.cheat-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:4vw;background:rgba(15,5,26,.96);text-align:center}
.cheat-card{width:100%;max-width:1400px;border:6px solid #ffcf56;border-radius:35px;padding:5vh 4vw;background:linear-gradient(140deg,#50142e,#210d3f);box-shadow:0 0 90px #e3475988}
.cheat-icon{font-size:clamp(70px,11vw,170px);line-height:1.1}
.cheat-title{font-size:clamp(40px,7vw,110px);font-weight:1000;color:#ffdf72;margin:2vh 0}
.cheat-name{font-size:clamp(32px,5vw,85px);font-weight:900;overflow-wrap:anywhere}
.cheat-consequence{font-size:clamp(27px,3.5vw,65px);font-weight:800;margin:3vh 0}
.cheat-small{font-size:clamp(16px,2vw,28px);opacity:.85}

.tv-reset-fixed{position:fixed;top:10px;right:14px;z-index:9000;padding:12px 18px;border:2px solid #ffd769;border-radius:12px;background:#9b2145;color:white;font-size:15px;font-weight:800;box-shadow:0 4px 18px #0009;cursor:pointer;max-width:260px}
.tv-reset-fixed:hover{background:#c32d55}
body.tv-mode header{padding-right:275px}
@media(max-width:650px){.tv-reset-fixed{font-size:12px;padding:9px;max-width:150px}body.tv-mode header{padding-right:160px}}
</style></head><body><header><img src="logo.png"><div><h1>HAZTE UN CANUTILLO</h1><div class="small">15 preguntas · 2–10 concursantes · 1.000.000 de canutillos</div></div></header><main id="app">Conectando con la sala…</main><script>
const tv=new URLSearchParams(location.search).get('modo')==='tv',app=document.getElementById('app'),link=location.origin+location.pathname,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('es-ES');let id=localStorage.getItem('canutillo-player')||'',S=null,draft=[0,0,0,0],qid=-1,notice='',rulesOpen=false,busy=false,editing=false;
if(tv){document.body.classList.add('tv-mode');const resetButton=document.createElement('button');resetButton.className='tv-reset-fixed';resetButton.textContent='🔄 REINICIAR PARTIDA';resetButton.title='Reiniciar en cualquier momento y admitir nuevos concursantes';resetButton.onclick=()=>tvReset();document.body.appendChild(resetButton);}
const rules=`<div class="panel rules"><h2>📜 Normas</h2>Podéis jugar de una a diez personas. 15 preguntas: 1–5 fáciles, 6–10 medias, 11–15 difíciles. Cada uno empieza con 1.000.000 de canutillos. Puedes apostar hasta tu saldo disponible entre un máximo de tres de las cuatro opciones; como mínimo una queda sin apostar. Los canutillos que no apuestes se queman al resolver la pregunta. Solo conservas los apostados a la respuesta correcta; si no te quedan canutillos, quedas eliminado. Tenéis 90 segundos o hasta que todos confirméis. Los comodines de ruleta, pista y llamada se gastan una vez cada uno. La llamada permite buscar durante 40 segundos. Cada tres preguntas votáis entre dos categorías; en empate se decide al azar. Desde la 11, un único re-roll si lo aprueba al menos el 75 % de los concursantes que sigan en juego (si solo queda uno, puede aprobarlo por sí mismo). Quien se quede sin canutillos queda eliminado y ya no tiene que responder ni votar. Si todos quedan eliminados, termina la partida. Gana quien tenga más canutillos.</div>`;
async function api(action='state',extra={}){let r=await fetch('/api/game',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,id,hidden:document.hidden,...extra})});let j=await r.json();if(!r.ok)throw Error(j.error||'Error de conexión');if(j.id&&action==='join'){id=j.id;localStorage.setItem('canutillo-player',id)}S=j.state;if(qid!==S.q?.id){qid=S.q?.id;draft=[0,0,0,0];editing=false}return j;}
async function tvReset(){if(!confirm('¿REINICIAR TODA LA PARTIDA? Se expulsará a todos los jugadores y podrán entrar concursantes nuevos.'))return;await act('tvreset',{confirm:'REINICIAR'});}
async function leaveRoom(){if(!confirm('¿Salir de la sala?'))return;await act('leave');id='';localStorage.removeItem('canutillo-player');await refresh()}
async function resetRoom(){if(!confirm('¿Reiniciar la sala? Se eliminarán TODOS los jugadores registrados.'))return;await act('reset');id='';localStorage.removeItem('canutillo-player');await refresh()}
async function act(action,data={}){if(busy)return;busy=true;try{await api(action,data);notice='';render()}catch(e){notice=e.message;render()}finally{busy=false}}
function clock(){return Math.max(0,Math.ceil((S?.deadline-Date.now())/1000))}
function standings(){return `<div class="panel"><h2>🏆 Clasificación</h2>${Object.values(S.players).sort((a,b)=>b.balance-a.balance).map((p,i)=>`<p>${i+1}. <b>${esc(p.name)}</b> — ${money(p.balance)} 🪙 ${p.balance<=0?'💀 ELIMINADO':p.locked?'🔒':''}</p>`).join('')}</div>`}
function question(){let q=S.q,answer=S.reveal?.answer;return `<div class="panel"><span class="pill">Pregunta ${S.round}/15</span><span class="pill">${S.round<=5?'🟢 FÁCIL':S.round<=10?'🟡 MEDIA':'🔴 DIFÍCIL'}</span><span class="pill">${esc(q.cat)}</span><h2>${esc(q.text)}</h2>${tv?'':`<p class="small">Apuesta hasta tu saldo disponible. Lo que no apuestes se quemará al resolver la pregunta.</p>`}<div class="answers">${q.options.map((x,i)=>`<div class="answer ${answer===i?'correct':''} ${S.me?.eliminated?.includes(i)?'out':''}"><b>${'ABCD'[i]}.</b> ${esc(x)}${!tv&&S.phase==='bet'&&S.me&&!S.me.locked?`<input type="number" inputmode="numeric" min="0" max="${Math.max(0,S.me.balance-draft.reduce((a,b)=>a+b,0)+draft[i])}" step="1" data-bet="${i}" value="${draft[i]}" ${S.me.eliminated.includes(i)?'disabled':''}>`:''}</div>`).join('')}</div>${S.phase==='reveal'?`<h2>✅ Respuesta correcta: ${'ABCD'[answer]}. ${esc(q.options[answer])}</h2>`:''}</div>`}
function television(){let ps=Object.values(S.players),qr='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(link);return `<div class="stage">🎙️ ¡Que empiece el concursillo!</div>${S.phase==='lobby'?`<div class="panel" style="text-align:center"><h2>Escanead el QR para entrar</h2><div id="qr"><img alt="QR" src="${qr}"></div><p class="small">${esc(link)}</p><h3>${ps.length}/10 concursantes</h3>${ps.map(p=>`<span class="pill">${esc(p.name)} ${p.ready?'✓ Listo':'⌛'}</span>`).join('')}<p>Con 10 jugadores, la partida comienza automáticamente cuando todos estén listos. Con 1 a 9, puedes iniciarla aquí o desde el móvil de un concursante cuando todos estén preparados.</p>${ps.length>=1&&ps.length<10&&ps.every(p=>p.ready)?`<p><button onclick="act('tvstart')">▶ Iniciar partida (${ps.length} jugadores)</button></p>`:''}</div>${rules}`:''}${S.phase==='countdown'?`<div class="panel" style="text-align:center"><h2>¡Todos preparados!</h2><div class="timer" id="clock">${clock()} s</div></div>`:''}${['bet','reveal'].includes(S.phase)?`${question()}<div class="panel"><span class="timer" id="clock">${clock()} s</span><span class="pill">${ps.filter(p=>p.balance>0&&p.locked).length}/${ps.filter(p=>p.balance>0).length} apuestas confirmadas · ${ps.filter(p=>p.balance<=0).length} eliminados</span></div>`:''}${S.phase==='category'?`<div class="panel"><h2>🗳️ Votad la siguiente categoría</h2>${S.catOptions.map(c=>`<span class="pill">${esc(c)}: ${Object.values(S.votes).filter(v=>v===c).length} votos</span>`).join('')}<div class="timer" id="clock">${clock()} s</div></div>`:''}${S.phase==='finished'?`<div class="panel"><h2>${ps.every(p=>p.balance<=0)?'💀 Todos los concursantes han sido eliminados':`🏆 ¡Ganador: ${esc([...ps].sort((a,b)=>b.balance-a.balance)[0]?.name)}!`}</h2><p>Puedes reiniciar desde este portátil para admitir nuevos jugadores.</p></div>`:''}${S.phase==='exhausted'?'<div class="panel">No quedan preguntas inéditas. Añade más al archivo de preguntas.</div>':''}${S.phase!=='lobby'?standings():''}${S.announcement?`<div class="panel">📣 ${esc(S.announcement)}</div>`:''}`}
function mobile(){let p=S.me;if(!p)return `<div class="panel"><h2>🎉 ¡Bienvenido a Hazte un canutillo!</h2><form id="join"><input type="text" id="name" placeholder="Tu nombre de participante" maxlength="24" required><p><button>Entrar en la sala</button></p></form><p class="small">Máximo diez concursantes.</p></div>${rules}`;return `<div class="panel"><h2>¡Hola, ${esc(p.name)}! 👋</h2><div class="small">Tus canutillos</div><div class="gold">${money(p.balance)} 🪙</div><p class="small">🛡️ Incidencias antitrampas: ${p.infractions||0}/3</p><button class="secondary" onclick="rulesOpen=!rulesOpen;render()">${rulesOpen?'Ocultar':'Ver'} normas</button></div>${rulesOpen?rules:''}${S.phase==='lobby'?`<div class="panel"><h2>${Object.keys(S.players).length}/10 jugadores</h2><p>${p.ready?'✓ Ya estás listo. Esperando a los demás.':'Cuando estés preparado, confirma.'}</p><button onclick="act('ready')" ${p.ready?'disabled':''}>${p.ready?'✓ Listo':'Estoy listo'}</button>${Object.keys(S.players).length>=1&&Object.keys(S.players).length<10&&Object.values(S.players).every(x=>x.ready)?`<button onclick="act('start')">▶ Iniciar partida (${Object.keys(S.players).length} jugadores)</button>`:''}<p><button class="secondary" onclick="leaveRoom()">Salir de la sala</button><button class="secondary" onclick="resetRoom()">Reiniciar sala</button></p></div>`:''}${S.phase==='countdown'?`<div class="panel"><h2>¡Empezamos en…!</h2><div class="timer" id="clock">${clock()} s</div></div>`:''}${S.me.balance<=0&&S.phase!=='lobby'?`<div class="panel"><h2>💀 Has sido eliminado</h2><p>Te has quedado sin canutillos. Puedes seguir la partida, pero ya no tienes que responder ni votar.</p></div>`:''}${['bet','reveal'].includes(S.phase)?`${question()}${S.phase==='bet'&&p.balance>0?`<div class="panel"><div class="timer" id="clock">${clock()} s</div><p>Sin apostar (se quemarán): <b id="remaining">${money(Math.max(0,p.balance-draft.reduce((a,b)=>a+b,0)))}</b></p><button onclick="placeBet()" ${p.locked?'disabled':''}>${p.locked?'✓ Apuesta confirmada':'🔒 Confirmar apuesta'}</button><h3>🎁 Comodines</h3><button class="secondary" onclick="act('power',{type:'wheel'})" ${p.used.wheel||p.locked?'disabled':''}>🎡 Ruleta</button><button class="secondary" onclick="act('power',{type:'hint'})" ${p.used.hint||p.locked?'disabled':''}>💡 Pista</button><button class="secondary" onclick="act('power',{type:'call'})" ${p.used.call||p.locked?'disabled':''}>📞 Llamada</button>${p.spin!==null?`<p>🎡 Ruleta: ${p.spin} opciones incorrectas eliminadas.</p>`:''}${p.hint?`<p>💡 ${esc(p.hint)}</p>`:''}${p.callUntil>Date.now()?`<p>📞 Tiempo para buscar: <b id="callclock">${Math.ceil((p.callUntil-Date.now())/1000)}</b> segundos. <a target="_blank" href="https://google.com">Abrir Google</a></p>`:''}${S.round>=11&&!S.rerollUsed?`<h3>🔄 Re-roll</h3><button class="secondary" onclick="act('reroll')" ${S.rerollVotes[id]?'disabled':''}>Votar SÍ al re-roll</button><p>${Object.entries(S.rerollVotes).filter(([v,yes])=>yes&&S.players[v]?.balance>0).length}/${Math.max(1,Math.ceil(Object.values(S.players).filter(x=>x.balance>0).length*.75))} votos necesarios</p>`:''}</div>`:`<div class="panel">Se prepara la siguiente ronda…</div>`}`:''}${S.phase==='category'&&p.balance>0?`<div class="panel"><h2>Elige la siguiente categoría</h2>${S.catOptions.map((c,i)=>`<button onclick="act('vote',{cat:S.catOptions[${i}]})" ${S.votes[id]?'disabled':''}>${esc(c)}</button>`).join('')}<p>${S.votes[id]?'Voto registrado':'Vota antes de que termine el tiempo'}</p><div class="timer" id="clock">${clock()} s</div></div>`:''}${S.phase==='finished'?`<div class="panel"><h2>🏆 ¡Partida terminada!</h2><button onclick="act('new')">Nueva partida (con preguntas inéditas)</button></div>${standings()}`:''}${S.phase==='exhausted'?'<div class="panel">No quedan preguntas inéditas.</div>':''}`}
function render(){if(!S)return;if(document.activeElement?.id==='name'||document.activeElement?.dataset?.bet!==undefined)return;app.innerHTML=(notice?`<div class="error">${esc(notice)}</div>`:'')+(tv?television():mobile());
if(tv&&S.anticheatAlert&&Date.now()<S.anticheatAlert.until){
 const a=S.anticheatAlert,level=a.level;
 const message=level===1?'PRIMER AVISO':level===2?'PIERDE EL 25 % DE SUS CANUTILLOS':'PIERDE LA APUESTA DE ESTA PREGUNTA';
 app.insertAdjacentHTML('beforeend',`<div class="cheat-overlay" role="alert"><div class="cheat-card"><div class="cheat-icon">${level===3?'🚫':'⚠️'}</div><div class="cheat-title">¡ALERTA ANTITRAMPAS!</div><div class="cheat-name">${esc(a.name)}</div><div class="cheat-consequence">${message}</div><div class="cheat-small">Incidencia ${level} · La partida continúa automáticamente</div></div></div>`);
}
else if(tv&&S.powerAlert&&Date.now()<S.powerAlert.until&&S.powerAlert.round===S.round){
 const a=S.powerAlert;
 const types={wheel:['🎡','¡RULETA ACTIVADA!','La ruleta decide cuántas opciones incorrectas se eliminan'],hint:['💡','¡PISTA ACTIVADA!','El concursante recibe una pista en su móvil'],call:['📞','¡LLAMADA ACTIVADA!','40 segundos para buscar información']};
 const [emoji,heading,detail]=types[a.type]||['🎁','¡COMODÍN ACTIVADO!',''];
 app.insertAdjacentHTML('beforeend',`<div class="cheat-overlay power-overlay" role="alert"><div class="cheat-card"><div class="cheat-icon">${emoji}</div><div class="cheat-title">${heading}</div><div class="cheat-name">${esc(a.name)}</div><div class="cheat-consequence">${detail}</div><div class="cheat-small">El concurso continúa automáticamente</div></div></div>`);
}document.querySelectorAll('[data-bet]').forEach(el=>{const update=()=>{editing=true;const i=+el.dataset.bet;const max=Math.max(0,S.me.balance-draft.reduce((a,b)=>a+b,0)+draft[i]);const raw=Number(el.value);draft[i]=Number.isFinite(raw)?Math.min(max,Math.max(0,Math.floor(raw))):0;el.value=draft[i];document.querySelectorAll('[data-bet]').forEach(other=>{const j=+other.dataset.bet;other.max=Math.max(0,S.me.balance-draft.reduce((a,b)=>a+b,0)+draft[j]);});const r=document.querySelector('#remaining');if(r)r.textContent=money(Math.max(0,S.me.balance-draft.reduce((a,b)=>a+b,0)));};el.addEventListener('focus',()=>{editing=true;});el.addEventListener('input',update);el.addEventListener('change',update);el.addEventListener('blur',()=>{editing=false;render();});});let f=document.getElementById('join');if(f)f.onsubmit=e=>{e.preventDefault();act('join',{name:document.getElementById('name').value})};}
function placeBet(){let p=S.me;const total=draft.reduce((a,b)=>a+b,0);if(draft.some(v=>!Number.isSafeInteger(v)||v<0)||total>p.balance||draft.filter(v=>v>0).length>3||draft.some((v,i)=>v>0&&p.eliminated.includes(i))){notice='No puedes apostar más de tu saldo ni repartir entre más de tres opciones válidas.';editing=false;render();return}editing=false;act('bet',{bet:[...draft]})}
async function refresh(){if(busy)return;try{await api();notice='';render()}catch(e){if(!S)app.innerHTML='<div class="error">No se pudo conectar. Comprueba que has publicado el sitio mediante Git en Netlify y no con Netlify Drop. '+esc(e.message)+'</div>';}}
setInterval(()=>{let overlay=document.querySelector('.cheat-overlay');if(overlay&&((overlay.classList.contains('power-overlay')&&Date.now()>=S?.powerAlert?.until)||(!overlay.classList.contains('power-overlay')&&Date.now()>=S?.anticheatAlert?.until)))overlay.remove();let c=document.getElementById('clock');if(c)c.textContent=clock()+' s';let x=document.getElementById('callclock');if(x)x.textContent=Math.max(0,Math.ceil((S?.me?.callUntil-Date.now())/1000));},300);setInterval(refresh,1800);
function reportVisibility(hidden){
  if(tv||!id||!S?.me||S.phase!=='bet')return;
  fetch('/api/game',{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify({action:'visibility',id,hidden})}).then(()=>{if(!hidden)refresh()}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>reportVisibility(document.hidden));
window.addEventListener('pagehide',()=>reportVisibility(true));
window.addEventListener('pageshow',()=>{if(!document.hidden)reportVisibility(false)});
refresh();
</script></body></html>
